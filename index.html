<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemma de impuestos a las actvididades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="container-fluid">
    <div class="container-fluid">

        <div class="row">

            <div class="col-6">
                <!--Aqui va el formulario-->
                <div class="container text-center">

                    <div class="row">

                        <div class="col">

                            <input placeholder="codigo" name="txtCodigoCliente" id="txtCodigoCliente"
                                class="form-control" type="text">

                        </div>


                    </div>

                    <div class="row">

                        <div class="col">

                            <input placeholder="nombre" name="txtNombreCliente" id="txtNombreCliente"
                                class="form-control" type="text">

                        </div>


                    </div>

                    <div class="row">

                        <div class="col">

                            <input placeholder="direccion" name="txtDireccionCliente" id="txtDireccionCliente"
                                class="form-control" type="text">

                        </div>


                    </div>

                    <div class="row">

                        <div class="col">

                            <input placeholder="telefono" name="txtTelefonoCliente" id="txtTelefonoCliente"
                                class="form-control" type="text">

                        </div>


                    </div>

                    <div class="row">

                        <div class="col">

                            <input placeholder="email" name="txtEmailCliente" id="txtEmailCliente" class="form-control"
                                type="text">

                        </div>


                    </div>

                    <div class="row">

                        <div class="col">

                            <select name="cboTipoPersona" id="cboTipoPersona" class="form-control">
                                <option value="particular">Particular</option>
                                <option value="empresa">Empresa</option>
                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col">

                            <input type="button" value="Guardar" class="btn btn-primary">
                            <input type="button" value="Limpiar" class="btn btn-warning">
                            <input type="button" value="Buscar" class="btn btn-secondary">

                        </div>


                    </div>


                </div>


            </div>

            <div class="col-6">
                <!--Aqui va la tabla-->

            </div>


        </div>

    </div>





</body>



<script>

</script>

</html>
